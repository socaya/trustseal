{# Shared Borderless Calm Flat UI (0px border-radius · Surface Contrast over Borders) #}
{% if stamp_subnav is defined and stamp_subnav %}
<nav class="st-subnav" aria-label="Stamps sections">
  <a href="{{ url_for('tsd_stamps_views.library') }}"
     class="st-subnav__link{% if stamp_subnav == 'library' %} is-active{% endif %}">
    Library
  </a>
  <a href="{{ url_for('tsd_stamps_views.templates_page') }}"
     class="st-subnav__link{% if stamp_subnav == 'templates' %} is-active{% endif %}">
    Templates
  </a>
  <a href="{{ url_for('tsd_stamps_views.usage_page') }}"
     class="st-subnav__link{% if stamp_subnav == 'usage' %} is-active{% endif %}">
    Usage &amp; Audit
  </a>
  <a href="{{ url_for('tsd_stamps_views.verify_page') }}"
     class="st-subnav__link{% if stamp_subnav == 'verify' %} is-active{% endif %}">
    Forensic Verify
  </a>
</nav>
{% endif %}

<style>
/* ---- Borderless Calm Flat UI · 0px Radius · Whitespace & Surface Contrast ---- */
.st-flat,
.st-flat *,
.ts-page-header__actions .ts-btn,
.st-subnav,
.st-subnav * {
  border-radius: 0 !important;
}

.ts-page-header {
  margin-bottom: 20px;
}
.ts-page-title {
  font-size: var(--ts-fs-page-title, 21px) !important;
  font-weight: 600 !important;
  letter-spacing: -0.02em;
  color: var(--ts-text, #091e42);
}
.ts-page-header__actions {
  display: flex;
  gap: 4px;
  align-items: center;
}

/* Quiet borderless sub-navigation */
.st-subnav {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid rgba(15, 23, 42, 0.06);
  margin-bottom: 22px;
}
.st-subnav__link {
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ts-text-muted, #42526e);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 120ms ease, background 120ms ease;
}
.st-subnav__link:hover {
  color: var(--ts-text, #091e42);
  background: rgba(15, 23, 42, 0.03);
}
.st-subnav__link.is-active {
  color: var(--ts-brand-primary, #002769);
  font-weight: 600;
  border-bottom-color: var(--ts-brand-primary, #002769);
}

/* Borderless KPI tiles separated by calm canvas whitespace */
.st-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  background: transparent;
  border: 0;
  margin-bottom: 22px;
}
.st-metric {
  background: var(--ts-surface, #ffffff);
  border: 0;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.st-metric__label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ts-text-subtle, #7a869a);
}
.st-metric__value {
  font-size: 24px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.025em;
  color: var(--ts-text, #091e42);
  line-height: 1.2;
}
.st-metric__sub {
  font-size: 12px;
  color: var(--ts-text-subtle, #7a869a);
}
@media (max-width: 820px) {
  .st-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Borderless open toolbar sitting directly on canvas */
.st-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 0;
  background: transparent;
  border: 0;
  margin-bottom: 18px;
}
.st-search {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--ts-surface, #ffffff);
  border: 0;
  padding: 0 12px;
  height: 36px;
  min-width: 260px;
  flex: 1;
  max-width: 400px;
  transition: box-shadow 120ms ease;
}
.st-search:focus-within {
  box-shadow: inset 0 0 0 1.5px var(--ts-brand-primary, #002769);
}
.st-search svg { color: var(--ts-text-subtle, #7a869a); flex: 0 0 auto; }
.st-search input {
  border: 0;
  background: transparent;
  padding: 0;
  font-size: 13px;
  color: var(--ts-text, #091e42);
  width: 100%;
  outline: none;
}
.st-search input::placeholder { color: var(--ts-text-subtle, #7a869a); }
.st-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.st-chip {
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 6px 10px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ts-text-muted, #42526e);
  cursor: pointer;
  transition: color 120ms ease, border-color 120ms ease;
}
.st-chip:hover {
  background: transparent;
  color: var(--ts-text, #091e42);
}
.st-chip.is-active {
  background: transparent;
  color: var(--ts-brand-primary, #002769);
  font-weight: 600;
  border-bottom-color: var(--ts-brand-primary, #002769);
}
.st-toolbar__right {
  display: inline-flex;
  gap: 8px;
  align-items: center;
}
.st-select {
  height: 36px;
  padding: 0 12px;
  border: 0;
  background: var(--ts-surface, #ffffff);
  font-size: 12.5px;
  color: var(--ts-text-secondary, #253858);
  outline: none;
  cursor: pointer;
  transition: background 120ms ease, box-shadow 120ms ease;
}
.st-select:hover { background: #fbfcfe; }
.st-select:focus {
  box-shadow: inset 0 0 0 1.5px var(--ts-brand-primary, #002769);
}
.st-view-group {
  display: inline-flex;
  border: 0;
  background: var(--ts-surface, #ffffff);
}
.st-view-btn {
  border: 0;
  background: transparent;
  padding: 0 11px;
  height: 36px;
  font-size: 13px;
  color: var(--ts-text-subtle, #7a869a);
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.st-view-btn:hover { color: var(--ts-text, #091e42); background: rgba(15, 23, 42, 0.03); }
.st-view-btn.is-active { background: #e9f0fb; color: var(--ts-brand-primary, #002769); }

/* Borderless pure white panels & calm editorial tables */
.st-panel {
  background: var(--ts-surface, #ffffff);
  border: 0;
}
.st-panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  background: var(--ts-surface, #ffffff);
}
.st-panel__title {
  margin: 0;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ts-text, #091e42);
}
.st-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.st-table th {
  padding: 8px 12px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.055em;
  color: var(--ts-text-subtle, #7a869a);
  background: var(--ts-surface, #ffffff);
  border-bottom: 1px solid rgba(15, 23, 42, 0.06);
  white-space: nowrap;
}
.st-table td {
  padding: 7px 12px;
  border-bottom: 1px solid rgba(15, 23, 42, 0.04);
  color: var(--ts-text, #091e42);
  vertical-align: middle;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 280px;
  line-height: 1.3;
}
.st-table td br { display: none; }
.st-table tbody tr:last-child td { border-bottom: 0; }
.st-table tbody tr:hover {
  background: #f8fafd;
}

/* Clean editorial status typography (no boxed/pill chips) */
.st-tag {
  display: inline;
  padding: 0;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  background: transparent;
  color: var(--ts-text-muted, #42526e);
  border: 0;
}
.st-tag--ok   { background: transparent; color: #17633a; font-weight: 600; }
.st-tag--warn { background: transparent; color: #8a5300; font-weight: 600; }
.st-tag--bad  { background: transparent; color: #9b2c2c; font-weight: 600; }
.st-tag--info { background: transparent; color: #002769; font-weight: 600; }

.st-empty {
  padding: 56px 24px;
  text-align: center;
  background: var(--ts-surface, #ffffff);
  border: 0;
}
.st-empty__title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ts-text-secondary, #253858);
  margin-bottom: 14px;
}
.st-empty__actions {
  display: inline-flex;
  gap: 8px;
}
</style>
