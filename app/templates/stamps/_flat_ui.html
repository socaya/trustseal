{# Shared Borderless Calm Flat UI (0px border-radius · Surface Contrast over Borders) #}
{% if stamp_subnav is defined and stamp_subnav %}
<nav class="st-subnav" aria-label="Stamps sections">
  <a href="{{ url_for('tsd_stamps_views.library') }}"
     class="st-subnav__link{% if stamp_subnav == 'library' %} is-active{% endif %}">
    Library
  </a>
  <a href="{{ url_for('tsd_stamps_views.templates_page') }}"
     class="st-subnav__link{% if stamp_subnav == 'templates' %} is-active{% endif %}">
    Templates
  </a>
  <a href="{{ url_for('tsd_stamps_views.usage_page') }}"
     class="st-subnav__link{% if stamp_subnav == 'usage' %} is-active{% endif %}">
    Usage &amp; Audit
  </a>
  <a href="{{ url_for('tsd_stamps_views.verify_page') }}"
     class="st-subnav__link{% if stamp_subnav == 'verify' %} is-active{% endif %}">
    Forensic Verify
  </a>
</nav>
{% endif %}

<style>
/* ---- Borderless Calm Flat UI · 0px Radius · Whitespace & Surface Contrast ---- */
.st-flat,
.st-flat *,
.ts-page-header__actions .ts-btn,
.st-subnav,
.st-subnav * {
  border-radius: 0 !important;
}

.ts-page-header__actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* Unified TrustSeal Brand Sub-Navigation */
.st-subnav {
  display: flex;
  gap: 6px;
  border-bottom: 1.5px solid #dbe4f2;
  margin-bottom: 22px;
}
.st-subnav__link {
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  color: #475569;
  text-decoration: none;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px;
  transition: color 120ms ease, background 120ms ease;
}
.st-subnav__link:hover {
  color: #002769;
  background: #f4f7fc;
}
.st-subnav__link.is-active {
  color: #002769;
  font-weight: 700;
  border-bottom-color: #002769;
}

/* Unified Hairline-Divided TrustSeal KPI Strip (no fragmented cards) */
.st-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  background: #f4f7fc;
  border: 1px solid #dbe4f2;
  margin-bottom: 22px;
}
.st-metric {
  background: transparent;
  border: 0;
  border-right: 1px solid #dbe4f2;
  padding: 18px 22px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.st-metric:last-child { border-right: 0; }
.st-metric__label {
  font-size: 12.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #475569;
}
.st-metric__value {
  font-size: 26px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: #002769;
  line-height: 1.15;
}
.st-metric__sub {
  font-size: 13px;
  color: #64748b;
}
@media (max-width: 820px) {
  .st-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Open toolbar sitting directly on canvas */
.st-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 0;
  background: transparent;
  border: 0;
  margin-bottom: 16px;
}
.st-search {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--ts-surface, #ffffff);
  border: 1px solid var(--ts-border-default, #d5dce6);
  padding: 0 12px;
  height: 36px;
  min-width: 240px;
  flex: 1 1 280px;
  max-width: 440px;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}
.st-search:hover {
  border-color: var(--ts-border-strong, #b8c2d1);
}
.st-search:focus-within {
  border-color: var(--ts-brand-primary, #002769);
  box-shadow: 0 0 0 2px rgba(0, 39, 105, 0.12);
}
.st-search svg { color: var(--ts-text-subtle, #718494); flex: 0 0 auto; }
.st-search input {
  border: 0;
  background: transparent;
  padding: 0;
  font-size: 13px;
  color: var(--ts-text, #1d3648);
  width: 100%;
  outline: none;
}
.st-search input::placeholder { color: var(--ts-text-subtle, #718494); }
.st-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.st-chip {
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 6px 10px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ts-text-muted, #42526e);
  cursor: pointer;
  transition: color 120ms ease, border-color 120ms ease;
}
.st-chip:hover {
  background: transparent;
  color: var(--ts-text, #091e42);
}
.st-chip.is-active {
  background: transparent;
  color: var(--ts-brand-primary, #002769);
  font-weight: 600;
  border-bottom-color: var(--ts-brand-primary, #002769);
}
.st-toolbar__right {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.st-select {
  height: 36px;
  padding: 7px 12px;
  border: 1px solid var(--ts-border-default, #d5dce6);
  background-color: var(--ts-surface, #ffffff);
  font-size: 12.5px;
  line-height: 20px;
  color: var(--ts-text-secondary, #2c475a);
  outline: none;
  cursor: pointer;
  vertical-align: middle;
  white-space: nowrap;
  transition: border-color 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
}
.st-select:hover {
  background-color: #fbfcfe;
  border-color: var(--ts-border-strong, #b8c2d1);
}
.st-select:focus {
  border-color: var(--ts-brand-primary, #002769);
  box-shadow: 0 0 0 2px rgba(0, 39, 105, 0.12);
}
.st-view-group {
  display: inline-flex;
  border: 1px solid var(--ts-border-default, #d5dce6);
  background: var(--ts-surface, #ffffff);
}
.st-view-btn {
  border: 0;
  background: transparent;
  padding: 0 11px;
  height: 34px;
  font-size: 13px;
  color: var(--ts-text-subtle, #7a869a);
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.st-view-btn:hover { color: var(--ts-text, #091e42); background: rgba(15, 23, 42, 0.03); }
.st-view-btn.is-active { background: #e9f0fb; color: var(--ts-brand-primary, #002769); }

/* Crisp architectural white panels & calm editorial tables */
.st-panel {
  background: var(--ts-surface, #ffffff);
  border: 1px solid var(--ts-border, #ebeef2);
}
.st-panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--ts-border, #ebeef2);
  background: var(--ts-surface, #ffffff);
}
.st-panel__title {
  margin: 0;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ts-text, #1d3648);
}
.st-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.st-table th {
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.055em;
  color: var(--ts-text-subtle, #718494);
  background: var(--ts-surface-alt, #f9fafc);
  border-bottom: 1px solid var(--ts-border, #ebeef2);
  white-space: nowrap;
}
.st-table td {
  padding: 9px 14px;
  border-bottom: 1px solid rgba(15, 23, 42, 0.045);
  color: var(--ts-text, #1d3648);
  vertical-align: middle;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 280px;
  line-height: 1.35;
}
.st-table td br { display: none; }
.st-table tbody tr:last-child td { border-bottom: 0; }
.st-table tbody tr:hover {
  background: #f8fafd;
}

/* Clean editorial status typography (no boxed/pill chips) */
.st-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  background: transparent;
  color: var(--ts-text-muted, #4c6273);
  border: 0;
}
.st-tag--ok   { background: transparent; color: #17633a; font-weight: 600; }
.st-tag--warn { background: transparent; color: #8a5300; font-weight: 600; }
.st-tag--bad  { background: transparent; color: #9b2c2c; font-weight: 600; }
.st-tag--info { background: transparent; color: #002769; font-weight: 600; }

.st-empty {
  padding: 52px 24px;
  text-align: center;
  background: var(--ts-surface, #ffffff);
  border: 1px solid var(--ts-border, #ebeef2);
}
.st-empty__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  margin-bottom: 12px;
  background: var(--ts-surface-alt, #f9fafc);
  border: 1px solid var(--ts-border, #ebeef2);
  color: var(--ts-text-subtle, #718494);
}
.st-empty__title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ts-text, #1d3648);
  margin-bottom: 6px;
}
.st-empty__desc {
  max-width: 46ch;
  margin: 0 auto 18px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--ts-text-muted, #4c6273);
}
.st-empty__actions {
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}
</style>
