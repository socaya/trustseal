<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}TrustSeal{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts and Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

  <!-- AdminLTE Core CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='adminlte/css/adminlte.min.css') }}">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/trustseal.css') }}">
</head>

<body class="sidebar-mini layout-fixed">
  <div class="wrapper d-flex flex-column min-vh-100">

    {% if current_user.is_authenticated %}

      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3 sticky-top">
        <div class="container-fluid">
          <button class="btn btn-outline-secondary me-3" data-widget="pushmenu"><i class="fas fa-bars"></i></button>
          <a class="navbar-brand fw-bold text-primary" href="{{ url_for('system.main_views.home') }}">TrustSeal</a>
          <div class="d-flex align-items-center ms-auto">
            <span class="me-3 fw-semibold text-dark">{{ current_user.username }}</span>
            <a href="{{ url_for('auth_views.logout') }}" class="text-danger"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
          </div>
        </div>
      </nav>

      <!-- Sidebar and Content -->
      <div class="d-flex flex-grow-1">
        {% include 'partials/sidebar.html' %}

        <div class="content-wrapper flex-grow-1">
          <section class="content">
            <div class="container-fluid">
              {% include 'partials/messages.html' %}
              {% block content %}{% endblock %}
            </div>
          </section>
        </div>
      </div>

      {% include 'partials/footer.html' %}

    {% else %}
      <!-- Guest View -->
      <div class="container d-flex justify-content-center align-items-center min-vh-100">
        {% block login_content %}{% endblock %}
      </div>
    {% endif %}
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='adminlte/js/adminlte.min.js') }}"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="{{ url_for('static', filename='js/document_editor.js') }}"></script>
</body>
</html>
