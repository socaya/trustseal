{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="display-4 text-danger">500</h1>
    <p class="lead">Oops! Something went wrong on our end.</p>
    <hr>
    <p class="text-muted">We're working to fix it. Meanwhile, here's what we know:</p>

    <div class="alert alert-danger text-left" style="white-space: pre-wrap;">
        {{ error_info }}
    </div>

    <a href="{{ url_for('system.home') }}" class="btn btn-outline-primary">Return to Home</a>
</div>
{% endblock %}
