{% extends "layouts/signer.html" %}

{% block title %}Too many attempts · TRUSTSEAL{% endblock %}

{% block content %}
<section class="ts-panel" aria-labelledby="rl-heading" style="max-width: 640px; margin: 0 auto;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--ts-space-3); margin-bottom: var(--ts-space-3);">
    <h1 id="rl-heading" class="ts-page-title" style="font-size: 22px;">Too many attempts</h1>
    <span class="ts-status ts-status--warning">Rate limited</span>
  </div>
  <p style="margin: 0;">
    Please wait a moment and try again. This limit exists to protect
    invitation tokens from brute-force enumeration.
  </p>
</section>
{% endblock %}
