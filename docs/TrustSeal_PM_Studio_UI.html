<!doctype html>
<!--
TrustSeal PM Studio UI prototype

Integration into socaya/trustseal
- Use app/templates/layouts/app.html for the authenticated shell and existing navigation.
- Project register maps to app/templates/contracts/projects.html.
- Project workspace maps to app/templates/contracts/project_detail.html.
- Personal assignments and time entry map to app/templates/contracts/my_work.html.
- Scope the PM visual styles in app/static/css/pm_studio.css using app/static/css/tokens.css.
- Reuse the native project and timesheet blueprints. Bind contract evidence submission and
  decisions to the governed contracts, documents, and signatures workflows.
- Replace hash navigation, sample data, and local browser writes with scoped routes and
  requests. Enforce authorization, validation, version checks, and audit on the server.
-->

function filtered(rows){
 const f=pageState.filters;
 const tokens=Array.from(pageState.query.matchAll(/(?:(\w+):)?(?:"([^"]+)"|([^\s"]+))/g),m=>({field:(m[1]||'').toLowerCase(),value:(m[2]||m[3]).toLowerCase()}));
 const allowed={code:'id',name:'name',owner:'owner',status:'status',health:'health',portfolio:'portfolio',category:'detail',date:'date',contract:'contract',clause:'clause',due:'due'};
 const queryMatch=row=>tokens.every(t=>{
  const key=Object.hasOwn(allowed,t.field)?allowed[t.field]:'';
  const haystack=key?row[key]:Object.values(row).join(' ');
  return String(haystack||'').toLowerCase().includes(key||!t.field?t.value:t.field+':'+t.value);
 });
 return rows.filter(r=>{
  if(pageState.view==='mine'&&r.owner!==people[0])return false;
  if(pageState.view==='attention'&&!['At risk','Delayed'].includes(r.health))return false;
  if(pageState.view==='on-track'&&(r.health!=='On track'||['Closed','Archived'].includes(r.status)))return false;
  if(pageState.view==='closed'&&r.status!=='Closed')return false;
  return Object.keys(filterNames).every(k=>{
   if(!f[k])return true;
   if(k==='from')return Boolean(r.date)&&r.date>=f[k];
   if(k==='to')return Boolean(r.date)&&r.date<=f[k];
   return r[k]===f[k];
  })&&queryMatch(r);
 }).sort((a,b)=>{
  if(!pageState.sort)return 0;
  const x=a[pageState.sort],y=b[pageState.sort];
  return pageState.direction*(typeof x==='number'?x-y:String(x??'').localeCompare(String(y??''),'en',{numeric:true}));
 });
}

 const el=event.target;
 if(el.id==='query'){pageState.query=el.value;pageState.page=1;updateResult();return}
 if(!el.dataset.hours)return;
 const [r,c]=el.dataset.hours.split(',').map(Number);
 if(!el.validity.valid){$('time-feedback').textContent='Use a value from 0 to 24 hours in increments of 0.25 h.';return}
 draft(period).hours[r][c]=Number(el.value);
 const saved=writeLocal('time',timeDrafts);
 $('time-feedback').textContent=saved?'Draft saved in this browser.':'Draft saved for this session.';
 updateTimeTotals();
});
document.addEventListener('change',event=>{
 const {id,value}=event.target;
 if(['f-status','f-portfolio','f-owner','f-due'].includes(id)){
  pageState.filters[id.slice(2)]=value;pageState.page=1;updateResult();
 }
 if(id==='rows-size'){pageState.size=Number(value);pageState.page=1;updateResult();$('rows-size').focus()}
 if(id==='period'){period=value;render();$('period').focus()}
 if(id==='time-day-picker'){
  activeDay=Number(value);
  document.querySelectorAll('[data-time-day]').forEach(cell=>cell.classList.toggle('current-day',Number(cell.dataset.timeDay)===activeDay));
 }
 if(id==='section-picker'&&value)navigate('Projects',route.project,value);
 if(id==='project-picker')navigate('Projects',value,route.group,route.module,route.mode);
 if(id==='saved-view'&&value!==''){
  const saved=(views[dataKey(type())]||[])[Number(value)];
  Object.assign(pageState,{query:saved.query,filters:{...saved.filters},view:saved.view,page:1,sort:saved.sort,direction:saved.direction});
  render();$('saved-view').value=value;$('saved-view').focus();
 }
});
document.addEventListener('submit',event=>{
 const form=event.target, id=form.id;
 event.preventDefault();
 if(id==='obligation-submit'||id==='obligation-review'){saveObligation(event);return}
 const fields=new FormData(form);
 if(id==='filter-form'){
  const query=fields.get('query'), filterValues=Object.fromEntries(Object.keys(filterNames).map(key=>[key,fields.get(key)||'']));
  if(filterValues.from&&filterValues.to&&filterValues.from>filterValues.to){
   const end=form.elements.to;end.setCustomValidity('Choose a date on or after the start date.');end.reportValidity();end.addEventListener('input',()=>end.setCustomValidity(''),{once:true});return;
  }
  Object.assign(pageState,{query,filters:filterValues,page:1});
  const name=fields.get('viewName').trim();
  if(name){
   const key=dataKey(type());
   views[key]=(views[key]||[]).filter(v=>v.name!==name);
   views[key].push({name,query,filters:{...filterValues},view:pageState.view,sort:pageState.sort,direction:pageState.direction});writeLocal('views',views);
   flash('View saved.');
  }
 }
 if(id==='column-form'){
  const visible=['name',...fields.getAll('visible')];
  columnPrefs[dataKey(type())]=columns(type()).map(([key])=>key).filter(key=>!visible.includes(key));
  writeLocal('columns',columnPrefs);
 }
 if(id==='create-form'){
  const typeName=type(), key=dataKey(typeName), name=fields.get('name').trim(), isProject=typeName==='Projects';
  if(!name){form.elements.name.setCustomValidity('Enter a name.');form.elements.name.reportValidity();form.elements.name.addEventListener('input',()=>form.elements.name.setCustomValidity(''),{once:true});return}
  const count=(repository[key]||[]).length+1;
  const entry={id:isProject?'TS-P'+(1048+count):'LOCAL-'+String(count).padStart(3,'0'),name,owner:fields.get('owner'),date:fields.get('date'),
   ...(isProject?{portfolio:fields.get('portfolio'),status:'Draft',health:'Not assessed',progress:0}:{detail:fields.get('detail'),status:typeName==='Tasks'?'To do':typeName==='RAID register'?'Open':'Draft'})};
  (repository[key] ||= []).push(entry);
  writeLocal('records',repository);
  resetTable();
  pageState.query=entry.id;
  flash(isProject?'Draft project created.':'Record saved.');
 }
 $('dialog').close();
 render();
 if(id==='filter-form')$('query')?.focus();
});

 if(event.key==='/'&&!$('dialog').open&&$('query')&&!['INPUT','SELECT','TEXTAREA'].includes(event.target.tagName)){
  event.preventDefault();$('query').focus();
 }
});

function compareDate(row){
 const delta=Math.round((Date.parse(row.forecast)-Date.parse(row.date))/86400000);
 return '<span class="date-variance '+(delta>0?'late':delta<0?'ahead':'')+'">'+(delta>0?delta+' days late':delta<0?Math.abs(delta)+' days early':'On the due date')+'</span>';
}

}

 const rows=obligationRows();
 const late=rows.filter(row=>row.due==='Overdue').length;
 const pending=rows.filter(row=>row.status==='In review').length;
 return '<div class="obligation-intro studio-section panel"><p class="muted">'+(rows.length
  ? E(rows.length+' obligations · '+late+' overdue · '+pending+' in review')

  (global?button('Open linked project','data-project="'+pilotProject+'"','folder','',''):'')+'</div>';

 return '<section class="panel studio-section"><div class="section-line"><h2>Contract closeout checks</h2>'+badge(!rows.length?'No linked obligations':blocked.length?'Blocked':'Obligations complete')+'</div>'+

 '<ul class="activity-stack">'+blocked.map(row=>'<li><button class="row-name" data-obligation="'+E(row.id)+'">'+E(row.name)+'</button>'+badge(row.status)+'</li>').join('')+'</ul></section>';

function studioOverview(project){
 if(!project||project.id!==pilotProject)return summary(project);
 const rows=obligationRows(), late=rows.filter(r=>r.due==='Overdue'), waiting=rows.filter(r=>r.status==='In review'), completed=rows.filter(r=>r.status==='Accepted');

 '<section class="panel studio-section"><div class="section-line"><h2>Contract obligations</h2>'+button('View register','data-module-jump="Obligations"','work')+'</div>'+

 '<section class="panel studio-section"><h2>Upcoming milestones</h2><ul class="detail-list"><li><span>Pilot rollout</span><strong>21 Dec 2026</strong></li><li><span>Operational handover</span><strong>11 Jan 2027</strong></li></ul></section></div></div></div>';

function openObligationDecision(id,review){
 const row=findObligation(id);
 if(!row)return;
 const version=(row.evidence||[]).at(-1);
 const body='<input type="hidden" name="obligation" value="'+E(id)+'">'+(review
  ? '<p class="form-note">Review '+E(version?.ref||'submitted evidence')+' against the acceptance criterion. This records a demo decision in this browser.</p>'+
  formSelect('Decision','decision',['Accepted','Returned'])+field('Decision note','note','','text','maxlength="150" required')
  : '<p class="form-note">Enter a reference to a demo evidence version. The integrated workspace will use the native TrustSeal document picker.</p>'+
  field('Evidence reference','ref','','text','maxlength="120" required'));
 dialog(review?'Review obligation evidence':'Submit evidence',row.name,body,cancel()+submit(review?'Record decision':'Send for review'),review?'obligation-review':'obligation-submit');
}
function saveObligation(event){
 const review=event.target.id==='obligation-review';
 const fields=new FormData(event.target), row=findObligation(fields.get('obligation'));
 if(!row)return;
 if(review&&row.status!=='In review'||!review&&['In review','Accepted'].includes(row.status))return;
 const evidence=[...(row.evidence||[])];
 let status='In review', note=(fields.get(review?'note':'ref')||'').trim();
 if(!note)return;
 if(review)status=fields.get('decision');
 else evidence.push({ref:note,version:evidence.length+1});
 const history=[{state:status,when:referenceToday,note:review?note:note+' submitted.'},...row.history];
 obligationEdits[row.id]={status,evidence,history};
 writeLocal('obligations',obligationEdits);
 $('dialog').close();
 render();
 flash(review?'Demo decision recorded.':'Evidence sent for demo review.');
}
